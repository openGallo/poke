name: Verify Ember
# Deliberately manual: no unapproved private-runner usage or automatic deployment.
# After reviewing your plan/usage, add pull_request and push events as desired.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pytest
      - run: python -m compileall -q ember scripts tests
      - run: node --check ember/static/app.js
      - run: python scripts/audit_tree.py --history
      - run: python scripts/http_smoke.py /tmp/ember-http-results.json
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/conditions_ui_checks.py /tmp/ember-ui-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-verification-results
          path: |
            /tmp/ember-http-results.json
            /tmp/ember-ui-results/
          if-no-files-found: ignore
          retention-days: 7
